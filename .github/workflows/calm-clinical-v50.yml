name: RADAR v0.50 calm clinical form and localized date tests
on:
  push:
    branches:
      - ui/calm-clinical-forms-v050-20261115
  pull_request:
    paths:
      - 'static/index.html'
      - 'tests/browser_calm_clinical_v50.py'
      - '.github/workflows/calm-clinical-v50.yml'
permissions:
  contents: read
jobs:
  clinical-ux:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install API and browser dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Check script syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          html=Path('static/index.html').read_text(encoding='utf-8')
          js=html.rsplit('<script>',1)[1].split('</script>',1)[0]
          Path('/tmp/radar-v50.js').write_text(js,encoding='utf-8')
          PY
          node --check /tmp/radar-v50.js
      - name: Test progressive patient form, native dates, persistence and five widths
        env:
          RADAR_MODE: local_demo
          RADAR_STORAGE: sqlite
        run: python tests/browser_calm_clinical_v50.py
      - name: Full API regression
        run: python -m pytest -q tests/test_*.py
      - name: Store synthetic desktop and mobile screenshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: radar-calm-clinical-v50
          path: docs/v50/*.png
          if-no-files-found: ignore
          retention-days: 7
