name: RADAR v0.49 clinical controls and button density
on:
  push:
    branches:
      - ui/clinical-controls-density-v049-20261115
  pull_request:
    paths:
      - 'static/index.html'
      - 'tests/browser_control_density_v49.py'
      - '.github/workflows/control-density-v49.yml'
permissions:
  contents: read
jobs:
  controls:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install application and browser test dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Verify frontend syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          html=Path('static/index.html').read_text(encoding='utf-8')
          script=html.rsplit('<script>',1)[1].split('</script>',1)[0]
          Path('/tmp/radar-v49.js').write_text(script,encoding='utf-8')
          PY
          node --check /tmp/radar-v49.js
      - name: Exercise real browser controls across five widths
        env:
          RADAR_MODE: local_demo
          RADAR_STORAGE: sqlite
        run: python tests/browser_control_density_v49.py
      - name: Run full Python API regression suite
        run: python -m pytest -q tests/test_*.py
      - name: Preserve synthetic desktop and mobile visual captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: radar-v49-clinical-controls
          path: docs/v49/*.png
          retention-days: 7
          if-no-files-found: ignore
