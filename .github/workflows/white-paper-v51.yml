name: RADAR v0.51 white workspace and lean spacing
on:
  push:
    branches: [ui/white-paper-density-v051-20261115]
  pull_request:
    paths:
      - 'static/index.html'
      - 'tests/browser_white_paper_v51.py'
      - '.github/workflows/white-paper-v51.yml'
permissions:
  contents: read
jobs:
  white-clinical-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python and Chromium
        run: |
          python -m pip install -r requirements.txt
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Validate frontend script
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('static/index.html').read_text(encoding='utf-8')
          Path('/tmp/radar-v51.js').write_text(s.rsplit('<script>',1)[1].split('</script>',1)[0],encoding='utf-8')
          PY
          node --check /tmp/radar-v51.js
      - name: Cross-width white paper browser verification
        env:
          RADAR_MODE: local_demo
          RADAR_STORAGE: sqlite
        run: python tests/browser_white_paper_v51.py
      - name: Full backend regressions
        run: python -m pytest -q tests/test_*.py
      - name: Save synthetic screenshot review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: radar-white-paper-v51
          path: docs/v51/*.png
          retention-days: 7
          if-no-files-found: ignore
