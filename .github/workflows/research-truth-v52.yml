name: RADAR v0.52 truthful research data and compact panels
on:
  push:
    branches: [ui/research-truth-v052-20261116]
  pull_request:
    paths:
      - 'static/index.html'
      - 'tests/browser_research_truth_v52.py'
      - '.github/workflows/research-truth-v52.yml'
permissions:
  contents: read
jobs:
  research-truth:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install API and browser dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Check frontend syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('static/index.html').read_text(encoding='utf-8')
          Path('/tmp/radar-v52.js').write_text(s.rsplit('<script>',1)[1].split('</script>',1)[0],encoding='utf-8')
          PY
          node --check /tmp/radar-v52.js
      - name: Browser test API outage, retry and persisted data
        env:
          RADAR_MODE: local_demo
          RADAR_STORAGE: sqlite
        run: python tests/browser_research_truth_v52.py
      - name: Complete Python API regression suite
        run: python -m pytest -q tests/test_*.py
      - name: Synthetic screenshots for visual review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: radar-research-truth-v52
          path: docs/v52/*.png
          if-no-files-found: ignore
          retention-days: 7
