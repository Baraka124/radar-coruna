name: RADAR centre registry regression
on:
  push:
    branches:
      - audit/no-fake-data-v045-20261115
  pull_request:
    paths:
      - 'server.py'
      - 'phase14_completion.py'
      - 'tests/test_centres_v45.py'
      - '.github/workflows/centre-registry.yml'
permissions:
  contents: read
jobs:
  centre-registry:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install synthetic test dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify syntax
        run: python -m compileall -q server.py phase14_completion.py
      - name: Verify browser script syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          html = Path('static/index.html').read_text(encoding='utf-8')
          assert '<script>' in html
          code = html.rsplit('<script>',1)[1].split('</script>',1)[0]
          Path('/tmp/radar-v45-browser.js').write_text(code,encoding='utf-8')
          PY
          node --check /tmp/radar-v45-browser.js
      - name: Exercise centre registry and legacy collaboration
        run: python -m pytest -q tests/test_*.py
