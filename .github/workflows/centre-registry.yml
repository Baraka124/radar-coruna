name: RADAR centre registry regression
on:
  push:
    branches:
      - audit/no-fake-data-v045-20261115
  pull_request:
    paths:
      - 'server.py'
      - 'phase14_completion.py'
      - 'tests/test_centres_v45.py'
      - '.github/workflows/centre-registry.yml'
permissions:
  contents: read
jobs:
  centre-registry:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install synthetic test dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify syntax
        run: python -m compileall -q server.py phase14_completion.py
      - name: Exercise centre registry and legacy collaboration
        run: python -m pytest -q tests/test_*.py
