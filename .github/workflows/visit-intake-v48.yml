name: RADAR v0.48 premium clinical intake
on:
  push:
    branches: [ui/visit-intake-premium-v048-20261115]
  pull_request:
    paths:
      - 'static/index.html'
      - 'tests/browser_visit_intake_v48.py'
      - '.github/workflows/visit-intake-v48.yml'
permissions:
  contents: read
jobs:
  visit-intake:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python and browser tooling
        run: |
          python -m pip install -r requirements.txt
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: JavaScript syntax validation
        run: |
          python - <<'PY'
          from pathlib import Path
          html=Path('static/index.html').read_text(encoding='utf-8')
          js=html.rsplit('<script>',1)[1].split('</script>',1)[0]
          Path('/tmp/radar-visit-intake-v48.js').write_text(js,encoding='utf-8')
          PY
          node --check /tmp/radar-visit-intake-v48.js
      - name: Complete Python API regression
        run: python -m pytest -q tests/test_*.py
      - name: Browser interaction and geometry acceptance
        env:
          RADAR_MODE: local_demo
          RADAR_STORAGE: sqlite
        run: python tests/browser_visit_intake_v48.py
      - name: Preserve synthetic screenshots for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: radar-visit-intake-v48
          path: docs/v48/evaluation_*.png
          retention-days: 7
          if-no-files-found: ignore
